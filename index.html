<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Walit Family Tree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">
  <header>
    <a class="nav-btn" href="directory.html">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
    </svg>
    Directory
    </a>
  <h1>Family Tree</h1>
  <p id="summary" class="hero-sub"></p>
</header>

<section id="filters">
  <input id="search" type="search" placeholder="Search by name">
  <select id="gender">
    <option value="all">All genders</option>
    <option value="male">Male</option>
    <option value="female">Female</option>
  </select>
  <select id="address"><option value="all">All locations</option></select>
  <select id="alive">
    <option value="all">Living and deceased</option>
    <option value="alive">Living</option>
    <option value="deceased">Deceased</option>
  </select>
  <button id="reset" type="button">Reset</button>
</section>

<p class="legend">
  <span class="dot male"></span>Male
  <span class="dot female"></span>Female
  <span class="dot deceased"></span>Deceased
</p>

  <main id="app"></main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
